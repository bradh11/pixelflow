[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "GPL-3.0-only"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
uuid = { version = "1.27.0", features = ["v4", "serde"] }
triple_buffer = "9.0.0"
clap = { version = "4.6.7", features = ["derive"] }
anyhow = "1.0.104"
ctrlc = { version = "3.5.2", features = ["termination"] }
proptest = "1.11.0"
tempfile = "3.27.0"
ureq = { version = "3.4.2", default-features = false }
roxmltree = "0.21.1"
socket2 = { version = "0.6.5", features = ["all"] }
if-addrs = "0.15.0"
mdns-sd = "0.21.4"
zstd = "0.14.3"
flate2 = "1.1.10"
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2"] }
realfft = "3.5.0"
schemars = { version = "=1.2.2", default-features = false, features = ["derive", "std", "uuid1"] }
unicode-normalization = "0.1.25"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "mp3", "wav", "flac", "vorbis", "mp4"] }
# rodio's own decoder, for reading tags (the same formats rodio decodes).
symphonia = { version = "0.5.5", default-features = false, features = ["mp3", "wav", "pcm", "flac", "ogg", "vorbis", "isomp4", "aac"] }
sha2 = "0.10.9"
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }
# Runs the on-device lyric alignment model (ONNX), pure Rust: nothing to install or bundle.
tract-onnx = "0.23.8"
# H.264 for video export: Cisco's own OpenH264 binary (BSD-2), downloaded by the user's copy of the
# app and loaded at run time (`libloading`). Compiled from the source the crate ships only for
# tests and developer tools, by pf-video's `encoder-from-source` feature (needs a C++ compiler;
# NASM speeds it up on x86 when present), never in the desktop app.
openh264 = { version = "0.9.8", default-features = false, features = ["libloading"] }
# Unpacking Cisco's OpenH264 download (.bz2): a pure-Rust decoder (MIT OR Apache-2.0).
bzip2-rs = "0.1.2"
# AAC-LC for video export's sound, in pure Rust (MIT).
oxideav-aac = "0.1.7"
# Reading the layout photo for video export and the Picture effect's files (pure Rust decoders).
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
# Writing test GIFs frame by frame (the `image` crate's own GIF reader and writer).
gif = "0.14.2"
# The threads frames are drawn on (work stealing; MIT OR Apache-2.0). Already in the tree by way
# of tract.
rayon = "1.12.0"
# Opening a USB DMX interface's serial port in raw 8-bit mode (termios on macOS and Linux, the DCB
# on Windows) and listing serial ports with their USB names (MPL-2.0). Without its default
# `libudev` feature, so Linux builds need no libudev: ports are listed from /sys instead.
serialport = { version = "4.10.1", default-features = false }
# Drawing the outlines of the computer's fonts for the Text effect (TrueType and CFF, collections):
# Google Fonts' fontations, kept up and used in Chrome (MIT OR Apache-2.0). Only its `std` feature
# (not the automatic hinter's shaping data, which nothing here uses).
skrifa = { version = "0.49.0", default-features = false, features = ["std"] }
pf-model = { path = "crates/pf-model" }
pf-geometry = { path = "crates/pf-geometry" }
pf-mapping = { path = "crates/pf-mapping" }
pf-frame = { path = "crates/pf-frame" }
pf-patterns = { path = "crates/pf-patterns" }
pf-output = { path = "crates/pf-output" }
pf-engine = { path = "crates/pf-engine" }
pf-devices = { path = "crates/pf-devices" }
pf-fseq = { path = "crates/pf-fseq" }
pf-xlights = { path = "crates/pf-xlights" }
pf-audio = { path = "crates/pf-audio" }
pf-sequence = { path = "crates/pf-sequence" }
pf-render = { path = "crates/pf-render" }
pf-shader = { path = "crates/pf-shader" }
pf-analysis = { path = "crates/pf-analysis" }
pf-camera-map = { path = "crates/pf-camera-map" }
pf-lexicon = { path = "crates/pf-lexicon" }
pf-align = { path = "crates/pf-align" }
pf-video = { path = "crates/pf-video" }
pf-fonts = { path = "crates/pf-fonts" }

# The camera-map tests decode synthetic video frames, which is slow unoptimized.
[profile.dev.package.pf-camera-map]
opt-level = 2

# Video export's tests encode a few small frames (with the encoder compiled from source) and a
# little sound; slow unoptimized.
[profile.dev.package.openh264-sys2]
opt-level = 2
[profile.dev.package.oxideav-aac]
opt-level = 2

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
