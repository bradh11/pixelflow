[package]
name = "pixelflow-app"
description = "PixelFlow desktop app (Tauri shell over pf-engine)"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[lib]
name = "pixelflow_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pf-engine = { path = "../../crates/pf-engine" }
pf-devices = { path = "../../crates/pf-devices" }
pf-model = { path = "../../crates/pf-model" }
pf-xlights = { path = "../../crates/pf-xlights" }
pf-audio = { path = "../../crates/pf-audio" }
pf-analysis = { path = "../../crates/pf-analysis" }
pf-sequence = { path = "../../crates/pf-sequence" }
pf-ai = { path = "../../crates/pf-ai" }
pf-geometry = { path = "../../crates/pf-geometry" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
pf-devices = { path = "../../crates/pf-devices", features = ["test-fixtures"] }
pf-ai = { path = "../../crates/pf-ai", features = ["test-fixtures"] }
pf-output = { path = "../../crates/pf-output" }
tauri = { version = "2", features = ["test"] }
tempfile = "3"

# The desktop shell is its own workspace so the core crates build and test without
# Tauri's system dependencies.
[workspace]

[lints.rust]
unsafe_code = "forbid"
