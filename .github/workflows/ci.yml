name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
  # Lets a branch be checked on all three systems before it has a pull request.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The engine crates. Formatting does not depend on the system, so only Linux checks it.
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # A run with a failing test still leaves its compiled dependencies for the next one.
          cache-on-failure: true
      - name: Install sound headers (for music playback)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Every file says the same version
        if: runner.os == 'Linux'
        run: node --test scripts/version.test.mjs && node scripts/version.mjs check
      - name: Lint
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Every crate's tests run, and run even when a lint failed: one run shows all there is to fix.
      - name: Test
        if: ${{ !cancelled() }}
        run: cargo test --workspace --locked --no-fail-fast

  # The UI and the desktop shell, on the two systems the app ships for.
  app:
    name: app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      # The app must never ship an H.264 encoder compiled from source: Cisco's patent licence
      # covers only the binary each user downloads from Cisco (crates/pf-video/src/cisco.rs).
      - name: No H.264 encoder compiled into the app
        if: runner.os == 'macOS'
        working-directory: .
        run: node --test scripts/encoder-check.test.mjs && node scripts/encoder-check.mjs
      - run: pnpm typecheck
      # The UI's tests run in a simulated browser, which is the same on every system, so one
      # system runs them. (On the slower Windows runners, the ones that wait a fixed time fail
      # now and then.)
      - run: pnpm test
        if: runner.os == 'macOS'
      # The shell is built and checked even when a UI test failed (it only needs the built UI).
      - run: pnpm build
        if: ${{ !cancelled() }}
      - name: Desktop shell format
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        working-directory: app/src-tauri
        run: cargo fmt --check
      - name: Desktop shell lint
        if: ${{ !cancelled() }}
        working-directory: app/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Desktop shell test
        if: ${{ !cancelled() }}
        working-directory: app/src-tauri
        run: cargo test --locked --no-fail-fast
      # A shader must come out as the same bits on every system. The engine's tests above prove
      # it on Linux and Windows; this is the third system (and the other kind of processor).
      - name: Shader engine, the same bits here
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        working-directory: .
        run: cargo test -p pf-shader --locked
      # The fidelity corpus's fingerprint holds on every system (the engine's tests above hold it
      # on Linux and Windows): it is made on one and must not move on another.
      - name: Fidelity corpus, the same picture here
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        working-directory: .
        run: cargo test -p pf-fidelity --locked --test corpus

  # The fidelity corpus (crates/pf-fidelity/corpus, docs/fidelity.md "The corpus in CI"): what
  # PixelFlow draws for it, held to its fingerprint, and how its imports look next to xLights'
  # own renders, held to the baseline. Until the references are rendered the second step passes
  # and says so.
  fidelity:
    name: fidelity corpus
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: fidelity
          cache-on-failure: true
      - name: Install sound headers (for music playback)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Build the fidelity tool
        run: cargo build --release --locked -p pf-fidelity
      - name: PixelFlow's own render, held to its fingerprint
        run: target/release/pf-fidelity fingerprint
      # Runs even when the fingerprint moved: one run shows both.
      - name: The imports next to xLights' renders, held to the baseline
        if: ${{ !cancelled() }}
        run: target/release/pf-fidelity regress
