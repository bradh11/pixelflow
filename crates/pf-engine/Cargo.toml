[package]
name = "pf-engine"
description = "PixelFlow engine: owns the show, applies edits with undo/redo, saves files, and runs live output"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
pf-model.workspace = true
pf-mapping.workspace = true
pf-geometry.workspace = true
pf-frame.workspace = true
pf-patterns.workspace = true
pf-output.workspace = true
pf-fseq.workspace = true
pf-audio.workspace = true
pf-sequence.workspace = true
pf-render.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
schemars = { workspace = true, optional = true }
unicode-normalization.workspace = true

[features]
# JSON Schemas for edits (the AI assistant's tool definitions are generated from them).
schema = ["dep:schemars", "pf-model/schema", "pf-sequence/schema"]

[dev-dependencies]
tempfile.workspace = true
pf-devices = { workspace = true, features = ["test-fixtures"] }

[lints]
workspace = true
