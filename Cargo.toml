[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
uuid = { version = "1.27.0", features = ["v4", "serde"] }
triple_buffer = "9.0.0"
clap = { version = "4.6.7", features = ["derive"] }
anyhow = "1.0.104"
proptest = "1.11.0"
tempfile = "3.27.0"
ureq = "3.4.2"
roxmltree = "0.21.1"
socket2 = { version = "0.6.5", features = ["all"] }
if-addrs = "0.15.0"
mdns-sd = "0.21.4"
pf-model = { path = "crates/pf-model" }
pf-geometry = { path = "crates/pf-geometry" }
pf-mapping = { path = "crates/pf-mapping" }
pf-frame = { path = "crates/pf-frame" }
pf-patterns = { path = "crates/pf-patterns" }
pf-output = { path = "crates/pf-output" }
pf-engine = { path = "crates/pf-engine" }
pf-devices = { path = "crates/pf-devices" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
